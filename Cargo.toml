[package]
name = "freemodel-workbuddy-proxy"
version = "2.0.0"
edition = "2024"
rust-version = "1.97"
description = "OpenAI-compatible Freemodel proxy using official WorkBuddy ACP"
license = "MIT"

[lib]
name = "freemodel_workbuddy_proxy"
path = "src/lib.rs"

[[bin]]
name = "freemodel-workbuddy-proxy"
path = "src/main.rs"

[[bin]]
name = "fake-codebuddy"
path = "tests/fixtures/fake_codebuddy.rs"
test = false
bench = false

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dashmap = "6.1"
futures-util = "0.3"
fs2 = "0.4"
http = "1.3"
nix = { version = "0.30", features = ["process", "signal"] }
parking_lot = "0.12"
ratatui = "0.29"
regex = "1.11"
rpassword = "7.4"
arboard = { version = "3.6", default-features = false }
unicode-width = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustyline = "16.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.46", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.17", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.0"
http-body-util = "0.1"
predicates = "3.1"
serial_test = "3.2"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
